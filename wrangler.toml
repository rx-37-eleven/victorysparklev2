# Victory Sparkle Co. — Cloudflare Pages configuration
#
# The blog reads D1 at build time via the Cloudflare REST API (see
# src/_data/blogposts.js), not through a runtime binding, so there is
# deliberately no [[d1_databases]] block here. A binding pointing at a
# nonexistent or wrong database would fail the Pages deploy for no benefit —
# the build-time API token (CF_API_TOKEN, set in the Pages dashboard) is all
# this repo needs.

name = "victorysparkle"                 # match your existing Pages project name
pages_build_output_dir = "_site"            # match your existing output dir
compatibility_date = "2026-07-04"
